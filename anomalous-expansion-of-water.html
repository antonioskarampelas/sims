<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Anomalous Expansion of Water</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: title, then the simulation canvas beside a control column, stacked on phones */
:root{
  --bg:#eef2f6; --panel:#ffffff; --ink:#16202c; --muted:#5a6878; --line:#d3dbe4;
  --accent:#1d5fc4; --hot:#d8452b; --cold:#2a78d6; --water:#cfe5f6; --ice:#f4f9fc;
  --deep:#1c4f96; --plant:#3f7d45; --stone:#8b8579;
  --canvas:#fbfcfe; --sky:#dce9f5; --grain:#c4861a; --earth:#c9c2b4;
  --f-display:"Barlow Semi Condensed","Arial Narrow",sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e131a; --panel:#161d27; --ink:#e5eaf1; --muted:#95a3b5; --line:#2b3644;
  --accent:#6ea3f2; --hot:#f0714f; --cold:#5aa2f2; --water:#4a7ea8; --ice:#dbe8f2; --deep:#0c2350; --plant:#5e9a5f; --stone:#6f695e;
  --canvas:#0b1017; --sky:#1b2737; --grain:#e3a63e; --earth:#3a352c; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e131a; --panel:#161d27; --ink:#e5eaf1; --muted:#95a3b5; --line:#2b3644;
  --accent:#6ea3f2; --hot:#f0714f; --cold:#5aa2f2; --water:#4a7ea8; --ice:#dbe8f2; --deep:#0c2350; --plant:#5e9a5f; --stone:#6f695e;
  --canvas:#0b1017; --sky:#1b2737; --grain:#e3a63e; --earth:#3a352c; color-scheme:dark }

body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 32px;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--f-display);font-weight:600;font-size:1.9rem;letter-spacing:.01em;margin:0;text-wrap:balance}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cap{margin:0;max-width:72ch;color:var(--muted)}
.grid{display:grid;grid-template-columns:minmax(0,2.1fr) minmax(250px,1fr);gap:16px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:10px;min-width:0}
canvas{display:block;width:100%;max-width:100%;border-radius:6px}
.ctrl{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:16px;min-width:0}
.field{display:flex;flex-direction:column;gap:4px}
.field label,.lbl{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.field output{font-family:var(--f-mono);color:var(--ink);text-transform:none;letter-spacing:0}
input[type=range]{width:100%;accent-color:var(--accent)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
button.b{font-family:var(--f-body);font-weight:700;font-size:.9rem;padding:8px 14px;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
button.b.primary{background:var(--accent);border-color:var(--accent);color:var(--panel)}
button.b:hover{border-color:var(--accent)}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 16px}
.sig{margin:0;text-align:right;font-size:.85rem;color:var(--muted)}
</style>

<div class="wrap">
  <header class="top"><h1>Anomalous Expansion of Water</h1><p class="sig">Designed by Dr. A. Karampelas · Built with Claude · 2026</p></header>

  <!-- Water -->
  <section id="p-water" style="display:flex;flex-direction:column;gap:12px">
    <p class="cap">Cool the air above a lake. Water is densest at 4 °C, so that water sinks to the bottom. Colder water and ice stay on top.</p>
    <div class="grid">
      <div class="stage"><canvas id="cvW"></canvas></div>
      <div class="ctrl">
        <div class="field"><label for="wA">Initial air temperature <output id="wAo"></output></label>
          <input type="range" id="wA" min="-10" max="15" step="1" value="-5"></div>
        <div class="field"><label for="wDay">Time <output id="wDayo">Day 0</output></label>
          <input type="range" id="wDay" min="0" max="45" step="1" value="0"></div>
        <div class="btns">
          <button class="b primary" id="wPlay">Play</button>
          <button class="b" id="wReset">Reset</button>
        </div>
      </div>
    </div>
  </section>
</div>

<script>
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const C={},P={};
function hex(c){c=c.replace('#','');return [0,2,4].map(i=>parseInt(c.substr(i,2),16));}
function readTokens(){const cs=getComputedStyle(document.documentElement);
  ['ink','muted','line','accent','hot','cold','water','ice','canvas','sky','grain','earth','panel','deep','plant','stone'].forEach(k=>{C[k]=cs.getPropertyValue('--'+k).trim();P[k]=hex(C[k]);});}
function mix(a,b,f){f=clamp(f,0,1);const A=P[a],B=P[b];return 'rgb('+Math.round(A[0]+(B[0]-A[0])*f)+','+Math.round(A[1]+(B[1]-A[1])*f)+','+Math.round(A[2]+(B[2]-A[2])*f)+')';}
readTokens();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',readTokens);
new MutationObserver(readTokens).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

function makeCanvas(id,W,H){const cv=document.getElementById(id);cv.style.aspectRatio=W+' / '+H;const ctx=cv.getContext('2d');
  const fit=()=>{const w=cv.clientWidth;if(!w)return;const d=window.devicePixelRatio||1;cv.width=Math.round(w*d);cv.height=Math.round(w*H/W*d);ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);};
  new ResizeObserver(fit).observe(cv);fit();return {cv,ctx,W,H};}
const fmt=(v,d=1)=>(v<0?'−':'')+Math.abs(v).toFixed(d);

/* ---------- Anomalous expansion of water ---------- */
const rho=T=>1000*(1-(T+288.9414)/(508929.2*(T+68.12963))*(T-3.9863)**2);
const WA={c:makeCanvas('cvW',600,380),n:5,sy:110,lh:48,cx:285,rx:250,ry:245,playing:false};
const TICK=1.5,MAXD=45;
function waBuild(){const Ta=WA.air,n=WA.n,T=[8,7,6,5,4],st=[{T:T.slice(),ice:0,sw:-1}];let ice=0;
  for(let d=1;d<=MAXD;d++){let sw=-1;
    for(let i=n-2;i>=0;i--)if(rho(T[i])>rho(T[i+1])+1e-7){const t=T[i];T[i]=T[i+1];T[i+1]=t;sw=i;break;}
    if(sw<0){
      if(ice>0){if(Ta<0){ice+=-Ta/5;if(T[0]>0)T[0]--;}else if(Ta>0)ice=Math.max(0,ice-Ta/5);}
      else if(Ta<T[0]){if(T[0]>0)T[0]--;else if(Ta<0)ice=-Ta/5;}else if(Ta>T[0])T[0]++;
      if(d%2===0){let b=-1,bd=1;for(let i=0;i<n-1;i++){const dd=Math.abs(T[i]-T[i+1]);if(dd>bd){bd=dd;b=i;}}
        if(b>=0){if(T[b]>T[b+1]){T[b]--;T[b+1]++;}else{T[b]++;T[b+1]--;}}}
    if(ice>0)T[0]=0;}
    st.push({T:T.slice(),ice,sw});}
  WA.st=st;}
function waSet(d){const s=WA.st[d];WA.day=d;WA.T=s.T.slice();WA.ice=s.ice;WA.sw=s.sw>=0?[s.sw]:[];$('#wDay').value=d;$('#wDayo').textContent='Day '+d;}
function waPause(){WA.playing=false;$('#wPlay').textContent='Play';}
waShape();
function waReset(){waBuild();waPause();WA.acc=TICK;waSet(0);}
function waStep(dt){WA.acc+=dt;if(WA.acc>=TICK){if(WA.day>=MAXD){waPause();return;}WA.acc=0;waSet(WA.day+1);}}
function waShape(){const {sy,cx,rx,ry}=WA,f=t=>1-0.06*Math.sin(2*t)+0.05*Math.sin(5*t)-0.03*Math.sin(9*t)+0.02*Math.sin(13*t);
  WA.pts=[];for(let i=0;i<=180;i++){const t=Math.PI*i/180,r=f(t);WA.pts.push([cx+rx*Math.cos(t)*r,sy+ry*Math.sin(t)*r]);}
  let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;WA.rocks=[];
  for(let k=0;k<60&&WA.rocks.length<26;k++){const X=rnd()*560,Y=sy+14+rnd()*(380-sy-14),R=7+rnd()*15,v=[];
    for(let j=0;j<7;j++){const a=j/7*6.283+rnd()*.5,rr=R*(.7+rnd()*.4);v.push([X+Math.cos(a)*rr,Y+Math.sin(a)*rr*.75]);}
    if(WA.rocks.some(o=>Math.hypot(o.X-X,o.Y-Y)<o.R+R+6))continue;WA.rocks.push({X,Y,R,v,shade:rnd()});}}
function lakePath(x){x.beginPath();x.moveTo(WA.pts[0][0],WA.pts[0][1]);for(const p of WA.pts)x.lineTo(p[0],p[1]);}
function lakeBy(X){const P=WA.pts;for(let i=1;i<P.length;i++){const a=P[i-1],b=P[i];if(X<=a[0]&&X>=b[0])return a[1]+(b[1]-a[1])*(a[0]-X)/(a[0]-b[0]);}return WA.sy;}
const SC={skyT:'#6fa9de',skyB:'#cfe6f7',wSkyT:'#93a9bf',wSkyB:'#e6edf3',mtn:'#93a8bd',mtnW:'#a9b8c7',hill:'#7fa862',hillW:'#eef3f7',hillWs:'#d3dee8',
  pine:'#2e5a38',trunk:'#5b3d26',grass:'#5f9440',snow:'#f7fafc',top:'#6b4a32',sub:'#a8875f',bed:'#8a8176',rockA:'#a39a8d',rockB:'#756d61',rockLine:'#5c554c',
  sun:'#ffcf4d',sunW:'#f5f1e1',cloud:'#ffffff',reed:'#557a35',reedHead:'#6b4426',ink:'#16202c',halo:'rgba(255,255,255,.85)'};
const MTN=[[0,72],[40,54],[85,68],[135,40],[185,62],[235,47],[290,66],[345,32],[400,60],[452,44],[505,64],[555,50],[600,62]];
const hillY=X=>WA.sy-14-9*Math.sin(X/58+.6)-5*Math.sin(X/21);
const PINES=[[14,22],[38,28],[62,20],[88,25],[448,24],[472,30],[497,21],[523,26],[566,22],[590,27]];
function hexMix(a,b,f){const A=hex(a),B=hex(b);return 'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*f)).join(',')+')';}
function label(x,t,X,Y){x.lineWidth=3;x.lineJoin='round';x.strokeStyle=SC.halo;x.strokeText(t,X,Y);x.fillStyle=SC.ink;x.fillText(t,X,Y);}
function waScene(x){const sy=WA.sy,win=WA.air<=0,now=performance.now()/1000;
  const dt=Math.min(.05,now-(WA.lastT||now));WA.lastT=now;
  const g=x.createLinearGradient(0,0,0,sy);g.addColorStop(0,win?SC.wSkyT:SC.skyT);g.addColorStop(1,win?SC.wSkyB:SC.skyB);x.fillStyle=g;x.fillRect(0,0,600,sy);
  if(!win){x.fillStyle='rgba(255,207,77,.25)';x.beginPath();x.arc(520,32,24,0,6.283);x.fill();}
  x.fillStyle=win?SC.sunW:SC.sun;x.beginPath();x.arc(520,32,win?12:15,0,6.283);x.fill();
  x.fillStyle=SC.cloud;x.globalAlpha=win?.95:.85;
  for(const [o,y,k] of [[0,24,1],[330,44,.8]]){const X=((now*6+o)%720)-60;for(const [dx,dy,r] of [[0,0,11],[13,-5,13],[27,0,10],[13,4,10]]){x.beginPath();x.arc(X+dx*k,y+dy*k,r*k,0,6.283);x.fill();}}
  x.globalAlpha=1;
  x.fillStyle=win?SC.mtnW:SC.mtn;x.beginPath();x.moveTo(0,sy);for(const p of MTN)x.lineTo(p[0],p[1]);x.lineTo(600,sy);x.closePath();x.fill();
  x.fillStyle=SC.snow;for(let i=1;i<MTN.length-1;i++){const [px,py]=MTN[i];if(py>50)continue;const d=(50-py)*.9+6;
    x.beginPath();x.moveTo(px,py);x.lineTo(px-d,py+d*.8);x.lineTo(px-d*.35,py+d*.6);x.lineTo(px,py+d*.85);x.lineTo(px+d*.4,py+d*.6);x.lineTo(px+d,py+d*.8);x.closePath();x.fill();}
  x.fillStyle=win?SC.hillW:SC.hill;x.beginPath();x.moveTo(0,sy);for(let X=0;X<=600;X+=6)x.lineTo(X,hillY(X));x.lineTo(600,sy);x.closePath();x.fill();
  if(win){x.fillStyle=SC.hillWs;x.beginPath();x.moveTo(0,sy);for(let X=0;X<=600;X+=6)x.lineTo(X,Math.max(hillY(X)+7,sy-6));x.lineTo(600,sy);x.closePath();x.fill();}
  for(const [px,h] of PINES){const b=hillY(px)+3;x.fillStyle=SC.trunk;x.fillRect(px-1.5,b-4,3,5);
    for(let k=0;k<3;k++){const w=h*(.42-k*.1),yb=b-4-k*h*.26,yt=yb-h*.42;x.fillStyle=SC.pine;x.beginPath();x.moveTo(px,yt);x.lineTo(px-w,yb);x.lineTo(px+w,yb);x.closePath();x.fill();
      if(win){x.fillStyle=SC.snow;x.beginPath();x.moveTo(px,yt);x.lineTo(px-w*.45,yt+(yb-yt)*.45);x.lineTo(px+w*.45,yt+(yb-yt)*.45);x.closePath();x.fill();}}}
  if(win){if(!WA.flakes){let sd=3;const r=()=>(sd=(sd*16807)%2147483647)/2147483647;WA.flakes=Array.from({length:55},()=>({x:r()*600,y:r()*sy,v:10+r()*14,s:1+r()*1.6,p:r()*6}));}
    x.fillStyle=SC.snow;for(const f of WA.flakes){f.y+=f.v*dt;if(f.y>sy){f.y=-4;f.x=Math.random()*600;}const X=f.x+4*Math.sin(now*.8+f.p);x.beginPath();x.arc(X,f.y,f.s,0,6.283);x.fill();}}
  x.fillStyle=SC.sub;x.fillRect(0,sy,600,380-sy);
  x.fillStyle=SC.bed;x.beginPath();x.moveTo(0,380);for(let X=0;X<=600;X+=10)x.lineTo(X,292+10*Math.sin(X/70+1)+4*Math.sin(X/19));x.lineTo(600,380);x.closePath();x.fill();
  x.fillStyle=SC.top;x.beginPath();x.moveTo(0,sy);for(let X=0;X<=600;X+=10)x.lineTo(X,sy+22+4*Math.sin(X/45)+2*Math.sin(X/13));x.lineTo(600,sy);x.closePath();x.fill();
  waRocks(x);
  x.fillStyle=win?SC.snow:SC.grass;x.fillRect(0,sy-1,600,win?6:5);
  if(!win){x.strokeStyle=SC.grass;x.lineWidth=1.5;for(let X=4;X<600;X+=9){x.beginPath();x.moveTo(X,sy);x.lineTo(X+2,sy-5-(X*7%5));x.stroke();}}}
function waReeds(x){const sy=WA.sy;x.lineWidth=2;x.lineCap='round';
  for(const [px,h] of [[8,34],[17,42],[26,30]]){x.strokeStyle=SC.reed;x.beginPath();x.moveTo(px,sy);x.quadraticCurveTo(px+2,sy-h*.5,px+1,sy-h);x.stroke();
    x.fillStyle=SC.reedHead;x.beginPath();x.ellipse(px+1,sy-h+8,2.6,6.5,0,0,6.283);x.fill();
    x.beginPath();x.moveTo(px,sy-2);x.quadraticCurveTo(px-8,sy-h*.45,px-10,sy-h*.55);x.stroke();}}
function waRocks(x){x.lineWidth=1.2;x.strokeStyle=SC.rockLine;for(const r of WA.rocks){x.fillStyle=hexMix(SC.rockA,SC.rockB,r.shade);x.beginPath();x.moveTo(r.v[0][0],r.v[0][1]);for(const p of r.v)x.lineTo(p[0],p[1]);x.closePath();x.fill();x.stroke();}}
function waBottom(x){const by=lakeBy;
  x.strokeStyle=C.plant;x.lineWidth=3;x.lineCap='round';
  for(const [px,h] of [[140,52],[152,40],[164,46],[396,44],[408,56],[420,38]]){const b=by(px)+4;
    for(const dx of [-6,0,6]){x.beginPath();x.moveTo(px,b);x.quadraticCurveTo(px+dx*1.5,b-h*.55,px+dx*.6+(dx===0?3:0),b-h+Math.abs(dx));x.stroke();}}
  x.lineWidth=1;x.strokeStyle=C.muted;x.fillStyle=C.stone;
  for(const [px,w,h] of [[196,11,6],[214,7,4],[247,13,7],[300,9,5],[322,12,6],[358,8,4],[376,12,6]]){const b=by(px);x.beginPath();x.ellipse(px,b-h+2,w,h,0,0,6.283);x.fill();x.stroke();}}
function waDraw(){const x=WA.c.ctx,{sy,lh,cx,rx,ry,n}=WA;
  waScene(x);
  x.save();lakePath(x);x.closePath();x.clip();
  const pr0=clamp((WA.acc||0)/1.2,0,1),pr=pr0*pr0*(3-2*pr0),sw=new Set(WA.sw||[]),Y=[];
  for(let i=0;i<n;i++)Y[i]=sy+i*lh;
  for(const i of sw){Y[i+1]=sy+i*lh+lh*pr;Y[i]=sy+(i+1)*lh-lh*pr;}
  const lay=i=>{x.fillStyle=mix('water','deep',WA.T[i]/8);x.fillRect(0,Y[i],600,lh+.5);};
  for(let i=0;i<n;i++)if(!sw.has(i-1))lay(i);
  for(const i of sw){x.fillStyle=mix('water','deep',WA.T[i]/8);x.fillRect(0,sy+i*lh,600,2*lh+.5);lay(i+1);x.strokeStyle=C.ice;x.lineWidth=3;x.strokeRect(-5,Y[i+1]+1.5,610,lh-3);
    x.fillStyle=C.ice;x.font='700 13px "Atkinson Hyperlegible",sans-serif';x.textAlign='center';x.fillText('▼ denser, sinks',cx,Y[i+1]+lh*.68);}
  waBottom(x);
  const fy=sy+(n-1)*lh+lh/2,ft=performance.now()/1000*2*Math.PI/12,fx=266+80*Math.sin(ft),fd=Math.cos(ft)>=0?1:-1;
  x.fillStyle=C.ink;x.beginPath();x.ellipse(fx+4*fd,fy,10,4.5,0,0,6.283);x.fill();x.beginPath();x.moveTo(fx-4*fd,fy);x.lineTo(fx-14*fd,fy-5);x.lineTo(fx-14*fd,fy+5);x.closePath();x.fill();
  if(WA.ice<=0){const wt=performance.now()/1000;x.lineWidth=2;
    for(const [dy,a,ph] of [[3,.75,0],[10,.35,2]]){x.strokeStyle='rgba(255,255,255,'+a+')';x.beginPath();
      for(let wx=0;wx<=600;wx+=8){const yy=sy+dy+2*Math.sin(wx/28-wt*1.6+ph);wx?x.lineTo(wx,yy):x.moveTo(wx,yy);}x.stroke();}}
  const th=WA.ice>0?Math.min(3+WA.ice*1.5,100):0;
  if(th){x.fillStyle=C.ice;x.fillRect(0,sy,600,th*.9);x.strokeStyle=C.muted;x.lineWidth=1;x.beginPath();x.moveTo(0,sy+th*.9);x.lineTo(600,sy+th*.9);x.stroke();}
  x.restore();
  if(th){x.fillStyle=C.ice;x.fillRect(cx-rx+2,sy-th*.1,2*rx-4,th*.1);x.strokeStyle=C.muted;x.lineWidth=1;x.beginPath();x.moveTo(cx-rx+2,sy);x.lineTo(cx-rx+2,sy-th*.1);x.lineTo(cx+rx-2,sy-th*.1);x.lineTo(cx+rx-2,sy);x.stroke();}
  x.strokeStyle=SC.rockLine;x.lineWidth=2;x.lineJoin='round';lakePath(x);x.stroke();waReeds(x);
  x.textAlign='right';
  for(let i=0;i<n;i++){x.font=(sw.has(i-1)?'700 13px':'500 12px')+' "IBM Plex Mono",monospace';label(x,fmt(WA.T[i],0),594,Y[i]+lh*.65);}
  x.font='12px "Atkinson Hyperlegible",sans-serif';label(x,'water °C',594,sy-7);
  x.textAlign='left';x.font='600 16px "Barlow Semi Condensed",sans-serif';label(x,'Air: '+fmt(WA.air,0)+' °C',14,24);
}
$('#wA').addEventListener('input',e=>{WA.air=+e.target.value;$('#wAo').textContent=fmt(WA.air,0)+' °C';waReset();});
$('#wDay').addEventListener('input',e=>{waPause();WA.acc=TICK;waSet(+e.target.value);});
$('#wPlay').addEventListener('click',()=>{if(WA.playing){waPause();return;}if(WA.day>=MAXD)waSet(0);WA.acc=TICK;WA.playing=true;$('#wPlay').textContent='Pause';});
$('#wReset').addEventListener('click',waReset);
WA.air=+$('#wA').value;$('#wAo').textContent=fmt(WA.air,0)+' °C';waReset();

/* ---------- Animation loop ---------- */
const sims={water:{step:dt=>{if(WA.playing)waStep(dt);},draw:waDraw}};
let active='water';
let last=performance.now();
function frame(now){const dt=Math.min(.033,(now-last)/1000);last=now;const s=sims[active];s.step(dt/2);s.step(dt/2);s.draw();requestAnimationFrame(frame);}
Object.values(sims).forEach(s=>s.draw());
requestAnimationFrame(frame);
</script>

</body></html>
