<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Hydrogen Spectra Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one dark observatory scene with the spectrum strip beneath it. Single deliberate dark look. */
:root {
  --bg: #07080f;
  --panel: #0d1020;
  --line: #22283f;
  --fg: #c9cee4;
  --muted: #7d84a3;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { background: var(--bg); color: var(--fg); }
body {
  font-family: var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 24px;
}
.wrap { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 16px; }
h1 { margin: 0; font-size: 22px; font-weight: 500; letter-spacing: 0.01em; color: var(--fg); text-wrap: balance; }
.sig { margin-left: auto; font-size: 12px; color: var(--muted); letter-spacing: 0.02em; }
.aim { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { font: inherit; font-size: 13px; color: var(--muted); background: transparent; border: 0; padding: 6px 14px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--line); color: var(--fg); }
.seg button:focus-visible { outline: 2px solid #8fa2ff; outline-offset: -2px; }
.scene, .strip {
  width: 100%; display: block; border: 1px solid var(--line); border-radius: 6px; background: var(--panel);
}
.scene { touch-action: none; cursor: default; }
.scene.grab { cursor: grab; }
.scene.dragging { cursor: grabbing; }
.scene:focus-visible { outline: 2px solid #8fa2ff; outline-offset: 2px; }
</style>

<div class="wrap">
  <div class="top">
    <h1>Emission and Absorption Spectra</h1>
    <div class="sig">Designed by Dr. A. Karampelas · Built with Claude · 2026</div>
  </div>
  <div class="aim">
    <span id="aim-label">Prism looks at</span>
    <div class="seg" role="group" aria-labelledby="aim-label">
      <button type="button" id="aim-cloud" aria-pressed="true">Cloud</button>
      <button type="button" id="aim-star" aria-pressed="false">Star</button>
    </div>
  </div>
  <canvas id="scene" class="scene" tabindex="0" aria-label="Star, hydrogen cloud and a movable prism. Drag the prism, or focus here and use the arrow keys."></canvas>
  <canvas id="strip" class="strip" aria-label="Spectrum seen through the prism"></canvas>
</div>

<script>
(function () {
  const W = 1000, H = 500;               // logical scene size
  const STAR = { x: 100, y: 250, r: 26 };
  const CLOUD = { x: 500, y: 250, r: 95 };
  const TOL = 28;                        // how close to the star–cloud line counts as "on the line"
  const BALMER = [656.3, 486.1, 434.0, 410.2];
  const prism = { x: 300, y: 250, size: 34 };

  const scene = document.getElementById('scene');
  const strip = document.getElementById('strip');
  const sctx = scene.getContext('2d');
  const tctx = strip.getContext('2d');
  let scale = 1, dpr = 1, stripW = 0, stripH = 0;

  // Seeded background stars
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const bgStars = Array.from({ length: 140 }, () => ({ x: rnd() * W, y: rnd() * H, r: rnd() * 1.1 + 0.2, a: rnd() * 0.6 + 0.2 }));
  const puffs = Array.from({ length: 9 }, () => ({ dx: (rnd() - 0.5) * 110, dy: (rnd() - 0.5) * 90, r: 45 + rnd() * 45 }));

  function wl2rgb(l) {
    let r = 0, g = 0, b = 0;
    if (l < 440) { r = -(l - 440) / 60; b = 1; }
    else if (l < 490) { g = (l - 440) / 50; b = 1; }
    else if (l < 510) { g = 1; b = -(l - 510) / 20; }
    else if (l < 580) { r = (l - 510) / 70; g = 1; }
    else if (l < 645) { r = 1; g = -(l - 645) / 65; }
    else { r = 1; }
    let f = 1;
    if (l < 420) f = 0.3 + 0.7 * (l - 380) / 40;
    else if (l > 700) f = 0.3 + 0.7 * (750 - l) / 50;
    const c = v => Math.round(255 * Math.pow(Math.max(0, v) * f, 0.8));
    return [c(r), c(g), c(b)];
  }
  const rgba = (l, a) => { const [r, g, b] = wl2rgb(l); return `rgba(${r},${g},${b},${a})`; };

  let target = 'cloud';

  // Does the sight line from the prism to the star pass through the cloud?
  function starBehindCloud() {
    const vx = STAR.x - prism.x, vy = STAR.y - prism.y;
    const t = Math.max(0, Math.min(1, ((CLOUD.x - prism.x) * vx + (CLOUD.y - prism.y) * vy) / (vx * vx + vy * vy)));
    return Math.hypot(prism.x + t * vx - CLOUD.x, prism.y + t * vy - CLOUD.y) < CLOUD.r;
  }

  function mode() {
    if (target === 'star') return starBehindCloud() ? 'absorption' : 'continuous';
    const onLine = Math.abs(prism.y - STAR.y) <= TOL;
    if (onLine && prism.x > CLOUD.x + CLOUD.r) return 'absorption';
    return 'emission';
  }

  function resize() {
    dpr = window.devicePixelRatio || 1;
    const cw = scene.clientWidth;
    scale = cw / W;
    scene.style.height = (H * scale) + 'px';
    scene.width = Math.round(cw * dpr);
    scene.height = Math.round(H * scale * dpr);
    stripW = strip.clientWidth;
    stripH = Math.max(56, Math.min(90, stripW * 0.08));
    strip.style.height = stripH + 'px';
    strip.width = Math.round(stripW * dpr);
    strip.height = Math.round(stripH * dpr);
    draw();
  }

  function drawFan(ctx, src, m) {
    let dx = prism.x - src.x, dy = prism.y - src.y;
    const len = Math.hypot(dx, dy) || 1; dx /= len; dy /= len;
    const L = 650;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const ray = (l, a, w) => {
      const dev = 0.16 + (750 - l) / 370 * 0.26;     // shorter wavelengths bend more
      const c = Math.cos(dev), s = Math.sin(dev);
      const rx = dx * c - dy * s, ry = dx * s + dy * c;
      ctx.strokeStyle = rgba(l, a); ctx.lineWidth = w;
      ctx.beginPath(); ctx.moveTo(prism.x, prism.y); ctx.lineTo(prism.x + rx * L, prism.y + ry * L); ctx.stroke();
    };
    if (m === 'emission') {
      BALMER.forEach(l => { ray(l, 0.25, 6); ray(l, 0.9, 1.6); });
    } else {
      for (let l = 380; l <= 750; l += 1.5) {
        if (m === 'absorption' && BALMER.some(b => Math.abs(l - b) < 3)) continue;
        ray(l, 0.09, 2.2);
      }
    }
    ctx.restore();
  }

  function drawScene() {
    const ctx = sctx;
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
    ctx.fillStyle = '#0d1020'; ctx.fillRect(0, 0, W, H);
    bgStars.forEach(s => { ctx.fillStyle = `rgba(220,225,255,${s.a})`; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill(); });

    const m = mode();

    // Starlight along the line through the cloud
    const beam = ctx.createLinearGradient(STAR.x, 0, W, 0);
    beam.addColorStop(0, 'rgba(255,250,235,0.35)');
    beam.addColorStop(1, 'rgba(255,250,235,0.08)');
    ctx.strokeStyle = beam; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(STAR.x, STAR.y); ctx.lineTo(W, STAR.y); ctx.stroke();

    // Light reaching the prism (off-axis: light emitted by the cloud)
    if (target === 'star') {
      ctx.strokeStyle = 'rgba(255,235,190,0.5)'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(STAR.x, STAR.y); ctx.lineTo(prism.x, prism.y); ctx.stroke();
    } else if (m === 'emission') {
      ctx.strokeStyle = 'rgba(255,140,170,0.45)'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(CLOUD.x, CLOUD.y); ctx.lineTo(prism.x, prism.y); ctx.stroke();
    }

    // Hydrogen cloud
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    puffs.forEach(p => {
      const g = ctx.createRadialGradient(CLOUD.x + p.dx, CLOUD.y + p.dy, 0, CLOUD.x + p.dx, CLOUD.y + p.dy, p.r);
      g.addColorStop(0, 'rgba(200,70,120,0.16)'); g.addColorStop(1, 'rgba(200,70,120,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(CLOUD.x + p.dx, CLOUD.y + p.dy, p.r, 0, 7); ctx.fill();
    });
    ctx.restore();

    // Star
    const sg = ctx.createRadialGradient(STAR.x, STAR.y, 0, STAR.x, STAR.y, STAR.r * 3);
    sg.addColorStop(0, 'rgba(255,255,245,1)'); sg.addColorStop(0.3, 'rgba(255,240,200,0.85)'); sg.addColorStop(1, 'rgba(255,220,160,0)');
    ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(STAR.x, STAR.y, STAR.r * 3, 0, 7); ctx.fill();

    // Cloud label
    ctx.fillStyle = 'rgba(225,200,215,0.9)';
    ctx.font = '500 16px Inter, system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Hydrogen cloud', CLOUD.x, CLOUD.y + CLOUD.r + 42);

    // Prism
    const s = prism.size, h = s * Math.sqrt(3) / 2;
    ctx.beginPath();
    ctx.moveTo(prism.x, prism.y - h * 2 / 3);
    ctx.lineTo(prism.x - s / 2, prism.y + h / 3 * 1);
    ctx.lineTo(prism.x + s / 2, prism.y + h / 3 * 1);
    ctx.closePath();
    ctx.fillStyle = dragging ? 'rgba(190,215,255,0.42)' : 'rgba(170,200,255,0.28)';
    ctx.fill(); ctx.strokeStyle = 'rgba(225,235,255,0.95)'; ctx.lineWidth = 1.6; ctx.stroke();
  }

  function drawStrip() {
    const ctx = tctx, m = mode();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, stripW, stripH);
    const x = l => (l - 380) / 370 * stripW;
    if (m !== 'emission') {
      for (let px = 0; px < stripW; px++) {
        const l = 380 + px / stripW * 370;
        ctx.fillStyle = rgba(l, 1); ctx.fillRect(px, 0, 1.5, stripH);
      }
      if (m === 'absorption') {
        BALMER.forEach(l => {
          const g = ctx.createLinearGradient(x(l) - 5, 0, x(l) + 5, 0);
          g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(0.5, 'rgba(0,0,0,0.95)'); g.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = g; ctx.fillRect(x(l) - 5, 0, 10, stripH);
        });
      }
    } else {
      ctx.globalCompositeOperation = 'lighter';
      BALMER.forEach(l => {
        const g = ctx.createLinearGradient(x(l) - 7, 0, x(l) + 7, 0);
        g.addColorStop(0, rgba(l, 0)); g.addColorStop(0.5, rgba(l, 1)); g.addColorStop(1, rgba(l, 0));
        ctx.fillStyle = g; ctx.fillRect(x(l) - 7, 0, 14, stripH);
        ctx.fillStyle = rgba(l, 1); ctx.fillRect(x(l) - 1.2, 0, 2.4, stripH);
      });
      ctx.globalCompositeOperation = 'source-over';
    }
  }

  function draw() { drawScene(); drawStrip(); }

  // Dragging
  let dragging = false, off = { x: 0, y: 0 };
  const toLogical = e => { const r = scene.getBoundingClientRect(); return { x: (e.clientX - r.left) / scale, y: (e.clientY - r.top) / scale }; };
  const onPrism = p => Math.hypot(p.x - prism.x, p.y - prism.y) < prism.size * 0.9;
  const pushOut = (o, minD) => {
    const dx = prism.x - o.x, dy = prism.y - o.y, d = Math.hypot(dx, dy);
    if (d >= minD) return;
    const ux = d ? dx / d : 1, uy = d ? dy / d : 0;
    prism.x = o.x + ux * minD; prism.y = o.y + uy * minD;
  };
  const clamp = () => {
    pushOut(STAR, STAR.r * 2 + prism.size / 2);
    pushOut(CLOUD, CLOUD.r + prism.size / 2);
    prism.x = Math.max(20, Math.min(W - 20, prism.x)); prism.y = Math.max(20, Math.min(H - 20, prism.y));
  };

  scene.addEventListener('pointerdown', e => {
    const p = toLogical(e);
    if (!onPrism(p)) return;
    dragging = true; off = { x: prism.x - p.x, y: prism.y - p.y };
    scene.setPointerCapture(e.pointerId); scene.classList.add('dragging'); draw();
  });
  scene.addEventListener('pointermove', e => {
    const p = toLogical(e);
    if (dragging) { prism.x = p.x + off.x; prism.y = p.y + off.y; clamp(); draw(); }
    else scene.classList.toggle('grab', onPrism(p));
  });
  const end = () => { if (!dragging) return; dragging = false; scene.classList.remove('dragging'); draw(); };
  scene.addEventListener('pointerup', end);
  scene.addEventListener('pointercancel', end);
  scene.addEventListener('keydown', e => {
    const step = e.shiftKey ? 30 : 8;
    const k = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[e.key];
    if (!k) return;
    e.preventDefault(); prism.x += k[0]; prism.y += k[1]; clamp(); draw();
  });

  const bCloud = document.getElementById('aim-cloud'), bStar = document.getElementById('aim-star');
  const setTarget = t => {
    target = t;
    bCloud.setAttribute('aria-pressed', t === 'cloud');
    bStar.setAttribute('aria-pressed', t === 'star');
    draw();
  };
  bCloud.addEventListener('click', () => setTarget('cloud'));
  bStar.addEventListener('click', () => setTarget('star'));

  window.addEventListener('resize', resize);
  resize();
})();
</script>

</body></html>
